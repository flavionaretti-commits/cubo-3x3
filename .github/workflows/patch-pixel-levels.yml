name: Corregge livelli Pixel Art

on:
  push:
    paths:
      - '.github/workflows/patch-pixel-levels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregge progressione dei quattro livelli
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('pixel-art.css')
          css = css_path.read_text(encoding='utf-8')

          old = '''.pixel-grid.easy .px.block-right{border-right:2px solid #1d2f42}\n.pixel-grid.easy .px.block-bottom{border-bottom:2px solid #1d2f42}'''
          new = '''.pixel-grid.easy .px.block-right,.pixel-grid.medium .px.block-right{border-right:2px solid #1d2f42}\n.pixel-grid.easy .px.block-bottom,.pixel-grid.medium .px.block-bottom{border-bottom:2px solid #1d2f42}'''
          if old not in css:
              raise SystemExit('Regole principali easy non trovate')
          css = css.replace(old, new, 1)

          old_finale = '''.pixel-grid.finale.easy .px.block-right{border-right:2px solid #1d2f42}\n.pixel-grid.finale.easy .px.block-bottom{border-bottom:2px solid #1d2f42}'''
          new_finale = '''.pixel-grid.finale.easy .px.block-right,.pixel-grid.finale.medium .px.block-right{border-right:2px solid #1d2f42}\n.pixel-grid.finale.easy .px.block-bottom,.pixel-grid.finale.medium .px.block-bottom{border-bottom:2px solid #1d2f42}'''
          if old_finale in css:
              css = css.replace(old_finale, new_finale, 1)

          css_path.write_text(css, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          old_cache = 'const CACHE_NAME = "cubo-3x3-github-v4-pixelart-permanent";'
          new_cache = 'const CACHE_NAME = "cubo-3x3-github-v5-pixelart-levels";'
          if old_cache not in sw:
              raise SystemExit('Versione cache attesa non trovata')
          sw = sw.replace(old_cache, new_cache, 1)
          sw_path.write_text(sw, encoding='utf-8')
          PY
      - name: Commit correzione livelli Pixel Art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixel-art.css service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Corregge livelli difficoltà Pixel Art"
          git push
