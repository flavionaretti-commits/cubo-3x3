name: Patch Pixel Art entry

on:
  push:
    paths:
      - '.github/workflows/patch-pixel-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserisce stabilmente il collegamento Pixel Art
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="./pixel-art-link.js?v=4" defer></script>'
          for name in ('index.html', '404.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if 'pixel-art-link.js' not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'Manca </body> in {name}')
                  text = text.replace('</body>', tag + '</body>', 1)
                  p.write_text(text, encoding='utf-8')
                  print('Aggiornato', name)
              else:
                  print('Già presente', name)
          PY
      - name: Commit della correzione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git diff --cached --quiet && exit 0
          git commit -m "Integra stabilmente accesso Pixel Art"
          git push
